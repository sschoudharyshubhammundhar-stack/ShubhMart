[build]
  publish = "."

[[redirects]]
  from = "/legal"
  to = "/legal-center.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://cdn.jsdelivr.net https://checkout.razorpay.com; connect-src 'self' https://yauveaexbpokhytqijae.supabase.co https://api.razorpay.com; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com; font-src 'self' data: https:; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests"
