<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShubhMart — Legal & Compliance Center</title><style>body{margin:0;font-family:Inter,Arial,sans-serif;background:#f7f7fb;color:#17132a}.wrap{max-width:1100px;margin:auto;padding:24px}.hero{background:linear-gradient(135deg,#32105f,#6d28d9);color:#fff;border-radius:22px;padding:28px;box-shadow:0 15px 45px #32105f22}.hero h1{margin:0 0 8px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tabs button{border:1px solid #e5e7eb;background:#fff;border-radius:999px;padding:9px 13px;cursor:pointer;font-weight:700}.tabs button.active{background:#4b168f;color:#fff;border-color:#4b168f}.card{background:#fff;border:1px solid #e9e7f0;border-radius:18px;padding:22px;margin:14px 0;box-shadow:0 4px 20px #00000008}.card h2{color:#32105f}.card h3{margin-top:22px}.card li{margin:7px 0}.note{background:#fff8e7;border-left:4px solid #f59e0b;padding:12px;border-radius:8px}.small{color:#667085;font-size:13px}a{color:#4b168f;font-weight:700}@media(max-width:600px){.wrap{padding:14px}.hero{padding:22px}.card{padding:16px}}</style></head><body><main class="wrap"><section class="hero"><h1>🛡️ ShubhMart Legal & Compliance Center</h1><p>Multi-seller marketplace policies, customer protections and seller requirements.</p><p class="small" style="color:#e9ddff">Draft platform policies — final statutory details and business particulars must be completed before public launch.</p></section><nav class="tabs" id="tabs"></nav><section id="content"></section></main><script>const docs={
terms:['Terms & Conditions',`<p>These Terms govern customer and seller use of ShubhMart. By using the platform, users agree to applicable laws and the platform rules displayed at the time of use.</p><h3>Marketplace role</h3><p>ShubhMart operates a digital marketplace where independent sellers may offer products. The seller identified on the applicable product/order information is responsible for the sale and seller-side obligations.</p><h3>Accounts</h3><p>Users must provide accurate information, protect credentials and must not misuse another person's account.</p><h3>Orders and payments</h3><p>Orders depend on product availability, seller fulfilment, payment authorization and applicable platform rules. Payment credentials should be handled by authorized payment partners.</p><h3>Product information</h3><p>Sellers are responsible for accurate descriptions, pricing, stock, images and legally required product declarations.</p><h3>Returns, refunds and cancellation</h3><p>The applicable product-level and platform policies govern returns, refunds and cancellation, subject to applicable law.</p>`],
privacy:['Privacy Policy',`<p>ShubhMart may process account, contact, delivery, order, support, payment-status, device and security information required to operate the marketplace.</p><h3>Uses</h3><ul><li>Authentication and account management.</li><li>Order processing, delivery, returns and refunds.</li><li>Customer and seller support.</li><li>Security, fraud prevention and legal compliance.</li></ul><h3>Data choices</h3><p>Where applicable, users may request access, correction, deletion or other rights through the published support/grievance channel. The final production policy should state the actual entity, contact details, retention periods and applicable data-protection notices.</p>`],
returns:['Return & Refund Policy',`<p>Return/refund eligibility depends on product category, seller terms, product condition, the stated return window and applicable law.</p><ul><li>Wrong, damaged or materially different products should be reported promptly.</li><li>Products must be returned in the required condition and with required components where applicable.</li><li>Certain permitted categories may have special or no-return rules.</li><li>Approved refunds are processed through the applicable payment/refund method.</li></ul><p>Sellers must honor the return/refund commitment displayed for their products.</p>`],
shipping:['Shipping & Delivery Policy',`<p>Delivery estimates depend on stock, seller location, customer location and logistics availability.</p><ul><li>Customers must provide a complete address and reachable mobile number.</li><li>Tracking may be shown where available.</li><li>Delays may occur due to logistics disruption, weather, public restrictions or other events outside reasonable control.</li><li>Failed delivery attempts may follow the logistics partner's process.</li></ul>`],
cancellation:['Cancellation Policy',`<p>Customers may request cancellation before an order reaches a stage where cancellation is operationally unavailable.</p><ul><li>Any cancellation charge must comply with applicable law and the checkout terms.</li><li>If an order is cancelled by the seller or ShubhMart, any applicable refund follows the payment/refund process.</li><li>Orders already shipped or locked for fulfilment may not be cancellable through the normal flow.</li></ul>`],
warranty:['Warranty & Guarantee Policy',`<p>Where a product carries a manufacturer, brand or seller warranty/guarantee, the applicable terms shown on the product page or invoice will apply.</p><ul><li>Warranty claims may require invoice/order proof and product serial or batch information.</li><li>Warranty does not automatically cover misuse, unauthorized modification, normal wear or exclusions stated by the warrantor.</li><li>ShubhMart may route eligible claims to the seller, manufacturer or authorized service provider.</li></ul><div class="note">Do not promise a platform-wide warranty where the underlying product does not carry one.</div>`],
seller:['Seller Agreement',`<p>Seller onboarding requires accurate identity/business information and compliance with laws applicable to the seller and its products.</p><h3>Seller obligations</h3><ul><li>Provide accurate name/business, address, PAN and applicable GST/tax details.</li><li>Provide bank/payout details and category-specific licences where applicable.</li><li>List genuine, legally saleable products.</li><li>Keep price, stock, description, images and mandatory declarations accurate.</li><li>Honor applicable orders, returns, refunds, warranty commitments and customer support obligations.</li></ul><h3>Platform controls</h3><p>ShubhMart may pause listings or suspend marketplace access for prohibited products, fraud, material misrepresentation, repeated policy violations or other permitted reasons, subject to applicable law and the seller agreement.</p>`],
sellerPolicy:['Seller Policy & KYC',`<h3>Seller onboarding checklist</h3><ul><li>Seller/business name, mobile, email and address.</li><li>PAN and bank/payout information.</li><li>GSTIN where applicable.</li><li>Udyam/MSME information where voluntarily provided.</li><li>Product/category-specific licence or certification where applicable.</li></ul><h3>Verification</h3><p>Seller applications remain Pending/Under Review until the ShubhMart verification process is completed. Admin verification may record notes and a rejection reason.</p><h3>Agreement acceptance</h3><p>Seller onboarding records acceptance of the applicable Seller Agreement and prohibited-product rules, including the agreement version used at acceptance.</p>`],
prohibited:['Prohibited & Restricted Products',`<p>The following must not be listed unless ShubhMart has specifically enabled the category and all applicable legal requirements are satisfied:</p><ul><li>Illegal, counterfeit or stolen goods.</li><li>Weapons, explosives and other restricted items.</li><li>Narcotics or unlawfully supplied controlled substances.</li><li>Unsafe, recalled or materially non-compliant products.</li><li>Products requiring licences/certifications that the seller cannot provide.</li><li>Fraudulent or materially misleading listings.</li></ul><p>Additional category controls may apply to food, cosmetics, medicines, medical devices, toys, electronics, packaged goods and other regulated products.</p>`],
grievance:['Grievance Redressal',`<p>ShubhMart provides customer support and a grievance mechanism for marketplace complaints.</p><h3>Process</h3><ol><li>Submit the issue with order/product details.</li><li>Receive a ticket/reference where supported.</li><li>ShubhMart and/or the responsible seller reviews the issue.</li><li>Return, refund, replacement or other resolution is handled under the applicable policy and law.</li></ol><h3>Grievance Officer</h3><p><b>Name:</b> To be appointed before public launch<br><b>Email:</b> To be published<br><b>Address:</b> To be published</p><div class="note">Actual responsible-person details must be entered before launch. Placeholder information must not be presented as final statutory details.</div>`],
contact:['Contact Us',`<p><b>Customer Support:</b> To be published before launch.</p><p><b>Business/Legal Address:</b> To be published after entity/business details are finalized.</p><p><b>Grievance Email:</b> To be published.</p><p>Support tickets can be used for order, payment, delivery, return/refund, account and seller-related complaints.</p>`]
};const tabs=document.getElementById('tabs');const content=document.getElementById('content');Object.entries(docs).forEach(([key,v])=>{const b=document.createElement('button');b.textContent=v[0];b.onclick=()=>openDoc(key);b.dataset.key=key;tabs.appendChild(b)});function openDoc(key){const d=docs[key]||docs.terms;content.innerHTML='<article class="card"><h2>'+d[0]+'</h2>'+d[1]+'</article>';document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.key===key));history.replaceState(null,'','#'+key)}openDoc(location.hash.slice(1)||'terms');</script></body></html>
