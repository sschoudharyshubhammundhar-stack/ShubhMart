<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShubhMart — Live Marketplace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#222}.top{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:5}.wrap{max-width:1100px;margin:auto;padding:16px}.brand{font-size:25px;font-weight:700}.search{width:100%;padding:12px;border-radius:10px;border:0;margin-top:12px;box-sizing:border-box}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001}.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#eee}.price{font-size:19px;font-weight:700}.old{text-decoration:line-through;color:#888}.btn{border:0;border-radius:9px;padding:10px 13px;background:#111;color:#fff;cursor:pointer;margin:4px 2px}.btn.alt{background:#eee;color:#111}.panel{background:#fff;padding:16px;border-radius:14px;margin:14px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}input,select,textarea{padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;width:100%;margin:5px 0}.hidden{display:none}.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.msg{padding:10px;border-radius:9px;background:#eef6ff;margin:8px 0}.danger{background:#fff0f0}.small{font-size:13px;color:#666}
</style></head>
<body>
<div class="top"><div class="wrap"><div class="brand">🛍️ SHUBHMART</div><div>Har Zaroorat, Ek Jagah</div><input id="search" class="search" placeholder="Product search..." oninput="loadProducts()"></div></div>
<div class="wrap">
<div class="nav">
<button class="btn" onclick="show('home')">Home</button><button class="btn" onclick="show('cart')">Cart 🛒</button>
<button class="btn" onclick="show('orders')">My Orders</button><button class="btn" onclick="show('account')">Account</button><a class="btn alt" href="admin.html" style="text-decoration:none">Admin Panel</a>
</div>
<div id="msg"></div>
<section id="home"><div class="panel"><h2>Products</h2><div id="products" class="grid">Loading...</div></div></section>
<section id="cart" class="hidden"><div class="panel"><h2>My Cart</h2><div id="cartbox"></div><button class="btn" onclick="checkout()">Proceed to Checkout</button></div></section>
<section id="orders" class="hidden"><div class="panel"><h2>My Orders</h2><div id="ordersbox">Login karke orders dekhein.</div></div></section>
<section id="account" class="hidden">
<div class="panel"><h2>Account</h2><div id="userbox"></div>
<div id="loginbox"><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password">
<button class="btn" onclick="login()">Login</button><button class="btn alt" onclick="signup()">New account / Signup</button></div>
<div id="addressbox" class="hidden"><h3>Delivery Address</h3><input id="aname" placeholder="Name"><input id="amobile" placeholder="Mobile"><input id="ahouse" placeholder="House/Shop"><input id="aarea" placeholder="Area"><input id="acity" placeholder="City"><input id="astate" placeholder="State"><input id="apin" placeholder="PIN code"><button class="btn" onclick="saveAddress()">Save Address</button><div id="addresses"></div><button class="btn alt" onclick="logout()">Logout</button></div>
</div></section>
</div>
<script>
const SUPABASE_URL="https://yauveaexbpokhytqijae.supabase.co";
const SUPABASE_KEY="sb_publishable_79SNGwvCzpL4OqWBAInVoA_d4xFht6g";
const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null, selectedAddress=null;

function note(t,danger=false){const e=document.getElementById('msg');e.className=danger?'msg danger':'msg';e.textContent=t;setTimeout(()=>e.textContent='',3500)}
function show(id){['home','cart','orders','account'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id)); if(id==='cart')loadCart(); if(id==='orders')loadOrders(); if(id==='account')loadAccount();}
async function loadProducts(){
 const q=document.getElementById('search').value.trim();
 let query=sb.from('products').select('*').eq('status','Active').order('created_at',{ascending:false});
 if(q) query=query.ilike('name','%'+q+'%');
 const {data,error}=await query;
 const el=document.getElementById('products'); if(error){el.innerHTML='<div>Products load error: '+error.message+'</div>';return}
 el.innerHTML=data?.length?data.map(p=>`<div class="card"><img src="${p.image_url||'https://placehold.co/500x400?text=ShubhMart'}"><h3>${esc(p.name)}</h3><div class="price">₹${Number(p.price||0).toFixed(0)} <span class="old">₹${Number(p.mrp||0).toFixed(0)}</span></div><div class="small">${esc(p.category||'')}</div><button class="btn" onclick="addCart('${p.id}')">Add to Cart</button><button class="btn alt" onclick="buy('${p.id}')">Buy Now</button></div>`).join(''):'No active products yet.';
}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function addCart(id){if(!currentUser){note('Pehle login/signup kijiye',true);show('account');return}const {error}=await sb.from('cart').upsert({customer_id:currentUser.id,product_id:id,quantity:1},{onConflict:'customer_id,product_id'});if(error)note(error.message,true);else note('Cart mein add ho gaya ✅');}
async function buy(id){await addCart(id);show('cart')}
async function loadCart(){
 if(!currentUser){document.getElementById('cartbox').innerHTML='Login kijiye.';return}
 const {data,error}=await sb.from('cart').select('id,quantity,product_id,products(id,name,price,mrp,image_url)').eq('customer_id',currentUser.id);
 if(error){document.getElementById('cartbox').textContent=error.message;return}
 let total=0;document.getElementById('cartbox').innerHTML=data?.length?data.map(x=>{total+=Number(x.products?.price||0)*x.quantity;return `<div class="panel row"><img src="${x.products?.image_url||'https://placehold.co/100x80'}" style="width:80px;height:60px;object-fit:cover;border-radius:8px"><div style="flex:1"><b>${esc(x.products?.name)}</b><br>₹${x.products?.price} × ${x.quantity}</div><button class="btn" onclick="changeQty('${x.id}',${x.quantity-1})">−</button><button class="btn" onclick="changeQty('${x.id}',${x.quantity+1})">+</button><button class="btn alt" onclick="removeCart('${x.id}')">Remove</button></div>`}).join('')+`<h3>Total: ₹${total.toFixed(2)}</h3>`:'Cart empty.';
}
async function changeQty(id,q){if(q<=0)return removeCart(id);await sb.from('cart').update({quantity:q}).eq('id',id).eq('customer_id',currentUser.id);loadCart()}
async function removeCart(id){await sb.from('cart').delete().eq('id',id).eq('customer_id',currentUser.id);loadCart()}
async function signup(){const email=document.getElementById('email').value,password=document.getElementById('password').value;if(!email||!password)return note('Email/password bhariye',true);const {data,error}=await sb.auth.signUp({email,password,options:{data:{full_name:prompt('Aapka naam?')||'',phone:prompt('Mobile number?')||''}}});if(error)note(error.message,true);else note(data.session?'Signup successful':'Signup successful. Email verification required.')}
async function login(){const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('password').value});if(error)note(error.message,true);else{currentUser=data.user;note('Login successful ✅');loadAccount()}}
async function logout(){await sb.auth.signOut();currentUser=null;selectedAddress=null;note('Logout ho gaya');loadAccount()}
async function loadAccount(){
 const box=document.getElementById('userbox'), lb=document.getElementById('loginbox'), ab=document.getElementById('addressbox');
 if(!currentUser){box.innerHTML='<div class="small">Customer login/signup karein.</div>';lb.classList.remove('hidden');ab.classList.add('hidden');return}
 lb.classList.add('hidden');ab.classList.remove('hidden');box.innerHTML=`Logged in: <b>${esc(currentUser.email)}</b>`;loadAddresses();
}
async function saveAddress(){if(!currentUser)return;const a={customer_id:currentUser.id,name:aname.value,mobile:amobile.value,house_shop:ahouse.value,area:aarea.value,city:acity.value,state:astate.value,pincode:apin.value,is_default:true};const {error}=await sb.from('addresses').insert(a);if(error)note(error.message,true);else{note('Address save ho gaya ✅');loadAddresses()}}
async function loadAddresses(){const {data,error}=await sb.from('addresses').select('*').eq('customer_id',currentUser.id).order('created_at',{ascending:false});const e=document.getElementById('addresses');if(error){e.textContent=error.message;return}e.innerHTML=data?.length?data.map(a=>`<div class="panel"><b>${esc(a.name)}</b>, ${esc(a.mobile)}<br>${esc(a.house_shop||'')} ${esc(a.area||'')}<br>${esc(a.city)}, ${esc(a.state)} - ${esc(a.pincode)}<br><button class="btn" onclick='selectAddress(${JSON.stringify(a)})'>Use this address</button></div>`).join(''):'No saved address.'}
function selectAddress(a){selectedAddress=a;note('Address selected ✅');}
async function checkout(){
 if(!currentUser){note('Pehle login kijiye',true);show('account');return}
 const {data:cart,error}=await sb.from('cart').select('id,quantity,product_id,products(id,name,price,seller_id)').eq('customer_id',currentUser.id);
 if(error||!cart?.length)return note(error?.message||'Cart empty',true);
 if(!selectedAddress){note('Account mein address select kijiye',true);show('account');return}
 const total=cart.reduce((s,x)=>s+Number(x.products.price)*x.quantity,0);
 const {data:ord,error:oe}=await sb.from('Orders').insert({customer_id:currentUser.id,customer_name:selectedAddress.name,customer_phone:selectedAddress.mobile,total_amount:total,payment_method:'cod',payment_status:'Pending',order_status:'Pending',shipping_address:`${selectedAddress.house_shop||''}, ${selectedAddress.area||''}, ${selectedAddress.city}, ${selectedAddress.state} - ${selectedAddress.pincode}`,address_id:selectedAddress.id}).select().single();
 if(oe)return note(oe.message,true);
 const items=cart.map(x=>({order_id:ord.id,product_id:x.product_id,quantity:x.quantity,unit_price:x.products.price,total_price:Number(x.products.price)*x.quantity}));
 const {error:ie}=await sb.from('Order_items').insert(items);if(ie){note(ie.message,true);return}
 await sb.from('cart').delete().eq('customer_id',currentUser.id);
 await sb.from('payments').insert({order_id:ord.id,customer_id:currentUser.id,amount:total,currency:'INR',method:'cod',status:'Pending'});
 note('Order placed successfully 🎉');show('orders');
}
async function loadOrders(){if(!currentUser)return;const {data,error}=await sb.from('Orders').select('*,Order_items(quantity,unit_price,total_price,products(name,image_url))').eq('customer_id',currentUser.id).order('created_at',{ascending:false});const e=document.getElementById('ordersbox');if(error){e.textContent=error.message;return}e.innerHTML=data?.length?data.map(o=>`<div class="panel"><b>Order #${o.id.slice(0,8)}</b><br>Amount: ₹${o.total_amount}<br>Status: <b>${esc(o.order_status)}</b><br>Payment: ${esc(o.payment_status)}<hr>${(o.Order_items||[]).map(i=>`${esc(i.products?.name||'Product')} × ${i.quantity} — ₹${i.total_price}`).join('<br>')}</div>`).join(''):'No orders yet.'}
sb.auth.getSession().then(({data})=>{currentUser=data.session?.user||null;loadProducts();loadAccount()});
sb.auth.onAuthStateChange((_e,s)=>{currentUser=s?.user||null;loadAccount()});
</script></body></html>
