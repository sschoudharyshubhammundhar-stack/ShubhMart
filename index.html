<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShubhMart — Live Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config/app-config.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#222}
.top{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:auto;padding:16px}
.brand{font-size:25px;font-weight:700}
.search{width:100%;padding:12px;border-radius:10px;border:0;margin-top:12px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#eee}
.price{font-size:19px;font-weight:700}
.old{text-decoration:line-through;color:#888}
.btn{border:0;border-radius:9px;padding:10px 13px;background:#111;color:#fff;cursor:pointer;margin:4px 2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:#eee;color:#111}
.panel{background:#fff;padding:16px;border-radius:14px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;width:100%;margin:5px 0}
.hidden{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.msg{padding:10px;border-radius:9px;background:#eef6ff;margin:8px 0}
.danger{background:#fff0f0}
.small{font-size:13px;color:#666}
.paybox{background:#fff;padding:16px;border-radius:14px;margin-top:15px;border:1px solid #ddd}
.payoption{display:block;padding:14px;margin:8px 0;background:#f7f7f7;border-radius:10px;cursor:pointer}
.payoption input{width:auto;margin-right:8px}
.success{background:#effff2}
</style>
</head>

<body>

<div class="top">
  <div class="wrap">
    <div class="brand">🛍️ SHUBHMART</div>
    <div>Har Zaroorat, Ek Jagah</div>
    <input id="search" class="search"
      placeholder="Product search..."
      oninput="loadProducts()">
  </div>
</div>

<div class="wrap">

<div class="nav">
  <button class="btn" onclick="show('home')">Home</button>
  <button class="btn" onclick="show('cart')">Cart 🛒</button>
  <button class="btn" onclick="show('orders')">My Orders</button>
  <button class="btn" onclick="show('account')">Account</button>
</div>

<div id="msg"></div>

<section id="home">
  <div class="panel">
    <h2>Products</h2>
    <div id="products" class="grid">Loading...</div>
  </div>
</section>

<section id="cart" class="hidden">
  <div class="panel">
    <h2>My Cart</h2>
    <div id="cartbox"></div>
    <button id="checkoutBtn" class="btn" onclick="checkout()">
      Proceed to Checkout
    </button>
  </div>
</section>

<section id="orders" class="hidden">
  <div class="panel">
    <h2>My Orders</h2>
    <div id="ordersbox">Login karke orders dekhein.</div>
  </div>
</section>

<section id="account" class="hidden">
  <div class="panel">
    <h2>Account</h2>

    <div id="userbox"></div>

    <div id="loginbox">
      <input id="email" type="email" autocomplete="email" placeholder="Email">
      <input id="password" type="password" autocomplete="current-password" placeholder="Password">

      <div id="signupFields" class="hidden">
        <input id="signupName" autocomplete="name" placeholder="Full name">
        <input id="signupPhone" autocomplete="tel" inputmode="tel" placeholder="Mobile number">
      </div>

      <button class="btn" onclick="login()">Login</button>
      <button class="btn alt" onclick="signup()">New account / Signup</button>
      <button class="btn alt" onclick="resetPassword()">Forgot password?</button>
    </div>

    <div id="addressbox" class="hidden">

      <h3>Delivery Address</h3>

      <input id="aname" placeholder="Name">
      <input id="amobile" placeholder="Mobile">
      <input id="ahouse" placeholder="House/Shop">
      <input id="aarea" placeholder="Area">
      <input id="acity" placeholder="City">
      <input id="astate" placeholder="State">
      <input id="apin" placeholder="PIN code">

      <button class="btn" onclick="saveAddress()">
        Save Address
      </button>

      <div id="addresses"></div>

      <button class="btn alt" onclick="logout()">
        Logout
      </button>

    </div>
  </div>
</section>

</div>

<script>

const PAYMENT_FUNCTION = "razorpay-payment";
const sb = window.shubhSupabase;

let currentUser = null;
let selectedAddress = null;
let checkoutBusy = false;


/* MESSAGE */

function note(text,danger=false){

  const e=document.getElementById("msg");

  e.className=danger ? "msg danger" : "msg";

  e.textContent=text;

  setTimeout(()=>{
    e.textContent="";
  },4000);
}


/* NAVIGATION */

function show(id){

  ["home","cart","orders","account"].forEach(x=>{
    document.getElementById(x)
      .classList.toggle("hidden",x!==id);
  });

  if(id==="cart") loadCart();

  if(id==="orders") loadOrders();

  if(id==="account") loadAccount();
}


/* ESCAPE */

function esc(s){

  return String(s??"").replace(
    /[&<>"']/g,
    c=>({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      '"':"&quot;",
      "'":"&#39;"
    }[c])
  );
}


/* PRODUCTS */

async function loadProducts(){

  const q=
    document.getElementById("search")
      .value.trim();

  let query=
    sb.from("products")
      .select("*")
      .eq("status","Active")
      .order("created_at",{ascending:false});

  if(q){
    query=query.ilike(
      "name",
      "%"+q+"%"
    );
  }

  const {data,error}=await query;

  const el=
    document.getElementById("products");

  if(error){

    el.innerHTML=
      "<div>Products load error: "+
      esc(error.message)+
      "</div>";

    return;
  }

  if(!data?.length){

    el.innerHTML="No active products yet.";

    return;
  }

  el.innerHTML=data.map(p=>`

    <div class="card">

      <img
        src="${p.image_url ||
        "https://placehold.co/500x400?text=ShubhMart"}"
      >

      <h3>${esc(p.name)}</h3>

      <div class="price">
        ₹${Number(p.price||0).toFixed(0)}

        <span class="old">
          ₹${Number(p.mrp||0).toFixed(0)}
        </span>
      </div>

      <div class="small">
        ${esc(p.category||"")}
      </div>

      <button class="btn"
        onclick="addCart('${p.id}')">
        Add to Cart
      </button>

      <button class="btn alt"
        onclick="buy('${p.id}')">
        Buy Now
      </button>

    </div>

  `).join("");
}


/* CART */

async function addCart(id){

  if(!currentUser){

    note(
      "Pehle login/signup kijiye",
      true
    );

    show("account");

    return;
  }

  const {error}=await sb
    .from("cart")
    .upsert(
      {
        customer_id:currentUser.id,
        product_id:id,
        quantity:1
      },
      {
        onConflict:
        "customer_id,product_id"
      }
    );

  if(error){

    note(error.message,true);

  }else{

    note("Cart mein add ho gaya ✅");

  }
}


async function buy(id){

  if(!currentUser){

    note(
      "Pehle login/signup kijiye",
      true
    );

    show("account");

    return;
  }

  await addCart(id);

  show("cart");
}


async function loadCart(){

  if(!currentUser){

    document.getElementById("cartbox")
      .innerHTML="Login kijiye.";

    return;
  }

  const {data,error}=await sb
    .from("cart")
    .select(
      "id,quantity,product_id,products(id,name,price,mrp,image_url)"
    )
    .eq(
      "customer_id",
      currentUser.id
    );

  if(error){

    document.getElementById("cartbox")
      .textContent=error.message;

    return;
  }

  let total=0;

  if(!data?.length){

    document.getElementById("cartbox")
      .innerHTML="Cart empty.";

    return;
  }

  document.getElementById("cartbox")
    .innerHTML=data.map(x=>{

      total +=
        Number(x.products?.price||0) *
        x.quantity;

      return `

        <div class="panel row">

          <img
            src="${x.products?.image_url ||
            "https://placehold.co/100x80"}"
            style="
              width:80px;
              height:60px;
              object-fit:cover;
              border-radius:8px
            "
          >

          <div style="flex:1">

            <b>
              ${esc(x.products?.name)}
            </b>

            <br>

            ₹${x.products?.price}
            × ${x.quantity}

          </div>

          <button class="btn"
            onclick="changeQty(
              '${x.id}',
              ${x.quantity-1}
            )">
            −
          </button>

          <button class="btn"
            onclick="changeQty(
              '${x.id}',
              ${x.quantity+1}
            )">
            +
          </button>

          <button class="btn alt"
            onclick="removeCart('${x.id}')">
            Remove
          </button>

        </div>

      `;

    }).join("")+

    `<h3>Total: ₹${total.toFixed(2)}</h3>`;
}


async function changeQty(id,q){

  if(q<=0){

    return removeCart(id);

  }

  await sb
    .from("cart")
    .update({
      quantity:q
    })
    .eq("id",id)
    .eq(
      "customer_id",
      currentUser.id
    );

  loadCart();
}


async function removeCart(id){

  await sb
    .from("cart")
    .delete()
    .eq("id",id)
    .eq(
      "customer_id",
      currentUser.id
    );

  loadCart();
}


/* AUTH */

async function signup(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;
  const name=document.getElementById("signupName").value.trim();
  const phone=document.getElementById("signupPhone").value.trim();

  if(!email || !password || !name || !phone){
    document.getElementById("signupFields").classList.remove("hidden");
    note("Name, mobile, email aur password bhariye.",true);
    return;
  }

  if(password.length<8){
    note("Password kam se kam 8 characters ka rakhein.",true);
    return;
  }

  const {data,error}=await sb.auth.signUp({
    email,
    password,
    options:{data:{full_name:name,phone:phone,role:"customer"}}
  });

  if(error){
    note(error.message,true);
    return;
  }

  document.getElementById("signupFields").classList.add("hidden");
  note(data.session ? "Signup successful ✅" : "Account ban gaya. Email verify karke Login karein.");
}

async function resetPassword(){

  const email=document.getElementById("email").value.trim();

  if(!email){
    note("Pehle email bhariye.",true);
    return;
  }

  const redirectTo=location.origin+location.pathname;
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo});

  if(error){
    note(error.message,true);
    return;
  }

  note("Password reset link email par bhej diya gaya hai.");
}


async function login(){

  const email=document.getElementById("email").value.trim();
  const password=document.getElementById("password").value;

  if(!email || !password){
    note("Email aur password bhariye.",true);
    return;
  }

  const {data,error}=await sb.auth.signInWithPassword({email,password});

  if(error){
    note(error.message,true);
  }else{
    currentUser=data.user;
    note("Login successful ✅");
    loadAccount();
  }
}


async function logout(){

  await sb.auth.signOut();

  currentUser=null;

  selectedAddress=null;

  note("Logout ho gaya");

  loadAccount();
}


/* ACCOUNT */

async function loadAccount(){

  const box=
    document.getElementById("userbox");

  const lb=
    document.getElementById("loginbox");

  const ab=
    document.getElementById("addressbox");
  const signupFields=document.getElementById("signupFields");

  if(!currentUser){

    box.innerHTML=
      '<div class="small">Customer login/signup karein.</div>';

    lb.classList.remove("hidden");

    ab.classList.add("hidden");
    if(signupFields) signupFields.classList.add("hidden");

    return;
  }

  lb.classList.add("hidden");

  ab.classList.remove("hidden");

  box.innerHTML=
    `Logged in:
     <b>${esc(currentUser.email)}</b>`;

  loadAddresses();
}


/* ADDRESS */

async function saveAddress(){

  if(!currentUser)return;

  const a={

    customer_id:currentUser.id,

    name:
      document.getElementById("aname").value,

    mobile:
      document.getElementById("amobile").value,

    house_shop:
      document.getElementById("ahouse").value,

    area:
      document.getElementById("aarea").value,

    city:
      document.getElementById("acity").value,

    state:
      document.getElementById("astate").value,

    pincode:
      document.getElementById("apin").value,

    is_default:true

  };

  const {error}=await sb
    .from("addresses")
    .insert(a);

  if(error){

    note(error.message,true);

  }else{

    note("Address save ho gaya ✅");

    loadAddresses();

  }
}


async function loadAddresses(){

  const {data,error}=await sb
    .from("addresses")
    .select("*")
    .eq(
      "customer_id",
      currentUser.id
    )
    .order(
      "created_at",
      {ascending:false}
    );

  const e=
    document.getElementById("addresses");

  if(error){

    e.textContent=error.message;

    return;
  }

  if(!data?.length){

    e.innerHTML="No saved address.";

    return;
  }

  e.innerHTML=data.map(a=>`

    <div class="panel">

      <b>${esc(a.name)}</b>,
      ${esc(a.mobile)}

      <br>

      ${esc(a.house_shop||"")}
      ${esc(a.area||"")}

      <br>

      ${esc(a.city)},
      ${esc(a.state)}
      -
      ${esc(a.pincode)}

      <br>

      <button class="btn"
        onclick='selectAddress(
          ${JSON.stringify(a)}
        )'>
        Use this address
      </button>

    </div>

  `).join("");
}


function selectAddress(a){

  selectedAddress=a;

  note("Address selected ✅");
}


/* CHECKOUT UI */

function paymentChoice(){

  return document
    .querySelector(
      'input[name="payment_method"]:checked'
    )?.value || "razorpay";
}


function setCheckoutBusy(value){

  checkoutBusy=value;

  const b=
    document.getElementById(
      "checkoutBtn"
    );

  if(b){

    b.disabled=value;

    b.textContent=
      value
      ? "Processing..."
      : "Proceed to Checkout";

  }
}


async function checkout(){

  if(checkoutBusy)return;

  if(!currentUser){

    note(
      "Pehle login kijiye",
      true
    );

    show("account");

    return;
  }

  if(!selectedAddress){

    note(
      "Account mein address select kijiye",
      true
    );

    show("account");

    return;
  }

  const box=
    document.getElementById("cartbox");

  if(document.getElementById("paymentBox")){

    return;
  }

  box.insertAdjacentHTML(
    "beforeend",

    `

    <div id="paymentBox" class="paybox">

      <h3>Payment Method</h3>

      <label class="payoption">

        <input
          type="radio"
          name="payment_method"
          value="razorpay"
          checked
        >

        <b>Online Payment</b>
        — UPI / Card / Net Banking

      </label>

      <label class="payoption">

        <input
          type="radio"
          name="payment_method"
          value="cod"
        >

        <b>Cash on Delivery</b>
        (COD)

      </label>

      <div class="small">

        Online payment me order tabhi
        Paid/Confirmed hoga jab Razorpay
        payment successfully verify ho jayega.

      </div>

      <br>

      <button
        class="btn"
        onclick="placeOrder()"
      >
        Continue
      </button>

      <button
        class="btn alt"
        onclick="
          document
          .getElementById('paymentBox')
          ?.remove()
        "
      >
        Cancel
      </button>

    </div>

    `
  );
}


/* PLACE ORDER */

async function placeOrder(){

  if(
    checkoutBusy ||
    !currentUser ||
    !selectedAddress
  )return;

  const method=
    paymentChoice();

  setCheckoutBusy(true);

  let ord=null;

  try{

    /* GET CART */

    const {data:cart,error}=await sb
      .from("cart")
      .select(
        "id,quantity,product_id,products(id,name,price,seller_id)"
      )
      .eq(
        "customer_id",
        currentUser.id
      );

    if(error || !cart?.length){

      throw new Error(
        error?.message || "Cart empty"
      );

    }

    /* TOTAL */

    const total=
      cart.reduce(
        (sum,x)=>
          sum+
          Number(
            x.products?.price || 0
          )*
          x.quantity,
        0
      );

    if(
      !Number.isFinite(total) ||
      total<=0
    ){

      throw new Error(
        "Invalid order amount"
      );

    }

    /* CREATE PENDING ORDER */

    const {data:o,error:oe}=
      await sb
      .from("Orders")
      .insert({

        customer_id:
          currentUser.id,

        customer_name:
          selectedAddress.name,

        customer_phone:
          selectedAddress.mobile,

        total_amount:
          total,

        payment_method:
          method,

        payment_status:
          "Pending",

        order_status:
          "Pending",

        shipping_address:
          `${selectedAddress.house_shop||""},
           ${selectedAddress.area||""},
           ${selectedAddress.city},
           ${selectedAddress.state}
           - ${selectedAddress.pincode}`,

        address_id:
          selectedAddress.id,

        currency:
          "INR",

        commission_amount:
          0,

        seller_earning:
          0

      })
      .select()
      .single();

    if(oe){

      throw new Error(
        oe.message
      );

    }

    ord=o;


    /* ORDER ITEMS */

    const items=
      cart.map(x=>({

        order_id:
          o.id,

        product_id:
          x.product_id,

        quantity:
          x.quantity,

        unit_price:
          x.products.price,

        total_price:
          Number(
            x.products.price
          )*
          x.quantity

      }));

    const {error:ie}=
      await sb
      .from("Order_items")
      .insert(items);

    if(ie){

      throw new Error(
        ie.message
      );

    }


    /* PAYMENT RECORD */

    const {error:pe}=
      await sb
      .from("payments")
      .insert({

        order_id:
          o.id,

        customer_id:
          currentUser.id,

        amount:
          total,

        currency:
          "INR",

        method:
          method,

        status:
          "Pending"

      });

    if(pe){

      throw new Error(
        "Payment record create nahi hua: "+
        pe.message
      );

    }


    /* COD */

    if(method==="cod"){

      await sb
        .from("cart")
        .delete()
        .eq(
          "customer_id",
          currentUser.id
        );

      note(
        "COD order successfully placed 🎉"
      );

      document
        .getElementById("paymentBox")
        ?.remove();

      setCheckoutBusy(false);

      show("orders");

      return;
    }


    /* RAZORPAY CREATE ORDER */

    const {
      data:gatewayData,
      error:fe
    }=
      await sb.functions.invoke(
        PAYMENT_FUNCTION,
        {

          body:{

            action:
              "create_order",

            order_id:
              o.id,

            amount:
              total

          }

        }
      );

    if(fe){

      throw new Error(
        fe.message ||
        "Payment gateway connect nahi hua"
      );

    }

    if(gatewayData?.error){

      throw new Error(
        gatewayData.error
      );

    }

    if(
      !gatewayData?.key_id ||
      !gatewayData?.razorpay_order_id
    ){

      throw new Error(
        "Razorpay order create nahi hua"
      );

    }


    /* RAZORPAY CHECKOUT */

    const options={

      key:
        gatewayData.key_id,

      amount:
        gatewayData.amount,

      currency:
        gatewayData.currency ||
        "INR",

      name:
        "ShubhMart",

      description:
        "ShubhMart Order",

      order_id:
        gatewayData.razorpay_order_id,

      prefill:{

        name:
          selectedAddress.name,

        email:
          currentUser.email,

        contact:
          selectedAddress.mobile

      },

      theme:{

        color:
          "#111111"

      },


      handler:
        async function(response){

          try{

            /* VERIFY PAYMENT */

            const {
              data:v,
              error:ve
            }=
              await sb.functions.invoke(
                PAYMENT_FUNCTION,
                {

                  body:{

                    action:
                      "verify_payment",

                    order_id:
                      o.id,

                    razorpay_order_id:
                      response.razorpay_order_id,

                    razorpay_payment_id:
                      response.razorpay_payment_id,

                    razorpay_signature:
                      response.razorpay_signature

                  }

                }
              );

            if(
              ve ||
              v?.error
            ){

              throw new Error(
                ve?.message ||
                v?.error ||
                "Payment verification failed"
              );

            }


            /* ONLY AFTER SUCCESS */

            await sb
              .from("cart")
              .delete()
              .eq(
                "customer_id",
                currentUser.id
              );


            note(
              "Payment successful ✅ Order confirmed 🎉"
            );

            document
              .getElementById("paymentBox")
              ?.remove();

            show("orders");

          }catch(err){

            note(
              "Payment verify nahi hua: "+
              err.message,
              true
            );

            show("orders");

          }finally{

            setCheckoutBusy(false);

          }

        },


      modal:{

        ondismiss:
          function(){

            note(
              "Payment window close ho gayi. Order Pending hai; aap dobara payment try kar sakte hain.",
              true
            );

            setCheckoutBusy(false);

            show("orders");

          }

      }

    };


    const rzp=
      new Razorpay(options);


    rzp.on(
      "payment.failed",
      function(response){

        note(
          "Payment failed: "+
          (
            response.error?.description ||
            "Please try again"
          ),
          true
        );

        setCheckoutBusy(false);

      }
    );


    rzp.open();


  }catch(err){

    note(
      err.message ||
      "Checkout failed",
      true
    );

    setCheckoutBusy(false);

  }

}


/* ORDERS */

async function loadOrders(){

  if(!currentUser){

    document.getElementById(
      "ordersbox"
    ).innerHTML=
      "Login karke orders dekhein.";

    return;
  }

  const {data,error}=
    await sb
    .from("Orders")
    .select(
      "*,Order_items(quantity,unit_price,total_price,products(name,image_url))"
    )
    .eq(
      "customer_id",
      currentUser.id
    )
    .order(
      "created_at",
      {ascending:false}
    );

  const e=
    document.getElementById(
      "ordersbox"
    );

  if(error){

    e.textContent=
      error.message;

    return;
  }

  if(!data?.length){

    e.innerHTML=
      "No orders yet.";

    return;
  }

  e.innerHTML=
    data.map(o=>`

      <div class="panel">

        <b>
          Order #${String(o.id).slice(0,8)}
        </b>

        <br>

        Amount:
        ₹${o.total_amount}

        <br>

        Order Status:
        <b>
          ${esc(o.order_status)}
        </b>

        <br>

        Payment Status:
        <b>
          ${esc(o.payment_status)}
        </b>

        <br>

        Payment Method:
        ${esc(o.payment_method)}

        <hr>

        ${
          (o.Order_items||[])
          .map(i=>`

            ${esc(
              i.products?.name ||
              "Product"
            )}

            × ${i.quantity}

            —
            ₹${i.total_price}

            <br>

          `)
          .join("")
        }

      </div>

    `).join("");
}


/* INITIAL LOAD */

sb.auth.getSession()
.then(({data})=>{

  currentUser=
    data.session?.user || null;

  loadProducts();

  loadAccount();

});


/* AUTH STATE */

sb.auth.onAuthStateChange(
  (_event,session)=>{

    currentUser=
      session?.user || null;

    loadAccount();

  }
);

</script>
