<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ShubhMart — Live Marketplace</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config/app-config.js"></script>
<script src="shared/supabase-client.js"></script>
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<style>
body{font-family:Arial,sans-serif;margin:0;background:#f6f7fb;color:#222}
.top{background:#111;color:#fff;padding:16px;position:sticky;top:0;z-index:5}
.wrap{max-width:1100px;margin:auto;padding:16px}
.brand{font-size:25px;font-weight:700}
.search{width:100%;padding:12px;border-radius:10px;border:0;margin-top:12px;box-sizing:border-box}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.card{background:#fff;border-radius:14px;padding:12px;box-shadow:0 2px 10px #0001}
.card img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#eee}
.price{font-size:19px;font-weight:700}
.old{text-decoration:line-through;color:#888}
.btn{border:0;border-radius:9px;padding:10px 13px;background:#111;color:#fff;cursor:pointer;margin:4px 2px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.alt{background:#eee;color:#111}
.cart-link{position:relative}
.cart-badge{display:inline-flex;min-width:20px;height:20px;align-items:center;justify-content:center;padding:0 5px;border-radius:10px;background:#ff6b00;color:#fff;font-size:12px;font-weight:700;margin-left:4px}
.panel{background:#fff;padding:16px;border-radius:14px;margin:14px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea{padding:11px;border:1px solid #ddd;border-radius:9px;box-sizing:border-box;width:100%;margin:5px 0}
.hidden{display:none}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.msg{padding:10px;border-radius:9px;background:#eef6ff;margin:8px 0}
.danger{background:#fff0f0}
.small{font-size:13px;color:#666}
.paybox{background:#fff;padding:16px;border-radius:14px;margin-top:15px;border:1px solid #ddd}
.payoption{display:block;padding:14px;margin:8px 0;background:#f7f7f7;border-radius:10px;cursor:pointer}
.payoption input{width:auto;margin-right:8px}
.success{background:#effff2}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="brand">🛍️ SHUBHMART</div><div>Har Zaroorat, Ek Jagah</div><input id="search" class="search" placeholder="Product search..." oninput="loadProducts()"></div></div>
<div class="wrap">
<div class="nav"><button class="btn" onclick="show('home')">Home</button><button class="btn cart-link" onclick="show('cart')">Cart 🛒 <span id="cartBadge" class="cart-badge">0</span></button><button class="btn" onclick="show('orders')">My Orders</button><button class="btn" onclick="show('account')">Account</button><button class="btn" onclick="location.href='seller/seller-panel.html'">🏪 Seller Panel</button><button class="btn" onclick="location.href='wholesale/index.html'">📦 Wholesale</button></div>
<div id="msg"></div>
<section id="home"><div class="panel"><h2>Products</h2><div id="products" class="grid">Loading...</div></div></section>
<section id="cart" class="hidden"><div class="panel"><h2>My Cart</h2><div id="cartbox"></div><button id="checkoutBtn" class="btn" onclick="checkout()">Proceed to Checkout</button></div></section>
<section id="orders" class="hidden"><div class="panel"><h2>My Orders</h2><div id="ordersbox">Login karke orders dekhein.</div></div></section>
<section id="account" class="hidden"><div class="panel"><h2>Account</h2><div id="userbox"></div><div id="loginbox"><input id="email" type="email" autocomplete="email" placeholder="Email"><input id="password" type="password" autocomplete="current-password" placeholder="Password"><div id="signupFields" class="hidden"><input id="signupName" autocomplete="name" placeholder="Full name"><input id="signupPhone" autocomplete="tel" inputmode="tel" placeholder="Mobile number"></div><button class="btn" onclick="login()">Login</button><button class="btn alt" onclick="signup()">New account / Signup</button><button class="btn alt" onclick="resetPassword()">Forgot password?</button></div><div id="addressbox" class="hidden"><h3>Delivery Address</h3><input id="aname" placeholder="Name"><input id="amobile" placeholder="Mobile"><input id="ahouse" placeholder="House/Shop"><input id="aarea" placeholder="Area"><input id="acity" placeholder="City"><input id="astate" placeholder="State"><input id="apin" placeholder="PIN code"><button class="btn" onclick="saveAddress()">Save Address</button><div id="addresses"></div><button class="btn alt" onclick="logout()">Logout</button></div></div></section>
</div>
<script src="customer/customer-app.js"></script>
<script src="customer/order-enhancements.js"></script>
</body>
</html>
