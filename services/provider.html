<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShubhMart Service Provider</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/app-config.js"></script><script src="../shared/supabase-client.js"></script><style>body{font-family:Arial;margin:0;background:#f6f7fb}.top{background:#111;color:#fff;padding:16px}.wrap{max-width:1000px;margin:auto;padding:16px}.panel,.card{background:#fff;border-radius:14px;padding:14px;margin:10px 0}.btn{border:0;border-radius:9px;padding:10px;background:#111;color:#fff;margin:4px}.alt{background:#eee;color:#111}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}.small{font-size:13px;color:#666}</style><link rel="stylesheet" href="../assets/shubhmart-responsive.css"></head><body><div class="top"><div class="wrap"><div><b>🛍️ ShubhMart <span style="color:#f5c400">SERVICE PROVIDER</span></b><div>Partner Center</div></div></div></div><div class="wrap"><button class="btn alt" onclick="location.href='index.html'">← Services</button><div id="msg"></div><section id="login" class="panel"><h2>Provider Login / Registration</h2><input id="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="name" placeholder="Provider name / business"><input id="phone" placeholder="Mobile"><input id="category" placeholder="Category"><input id="area" placeholder="Service area"><button class="btn" onclick="register()">Register</button><button class="btn alt" onclick="login()">Login</button></section><section id="app" class="hidden"><div class="panel"><b id="profile"></b> <button class="btn alt" onclick="logout()">Logout</button><h3>Add Service</h3><input id="sname" placeholder="Service name"><input id="scat" placeholder="Category"><textarea id="sdesc" placeholder="Description"></textarea><input id="sprice" type="number" placeholder="Price"><input id="sdurat
