<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShubhMart — Seller Verification</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,Arial,sans-serif;background:#f7f7fb;color:#111827;margin:0}.wrap{max-width:1100px;margin:auto;padding:20px}.card{background:#fff;border:1px solid #ececf3;border-radius:16px;padding:18px;margin:12px 0;box-shadow:0 4px 18px #0000000a}.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.btn{border:0;border-radius:9px;padding:10px 14px;background:#4b168f;color:#fff;cursor:pointer;font-weight:700}.btn.alt{background:#eeeaf5;color:#24113f}.btn.danger{background:#b42318}.small{font-size:13px;color:#667085}.badge{display:inline-block;padding:5px 9px;border-radius:20px;background:#fff4cc;font-size:12px;font-weight:800}.badge.ok{background:#dcfce7;color:#166534}.badge.no{background:#fee2e2;color:#991b1b}input,select,textarea{width:100%;box-sizing:border-box;padding:10px;border:1px solid #ddd;border-radius:9px;margin:5px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="card"><h1>🛡️ ShubhMart Seller Verification</h1><p class="small">Admin-only verification panel. Seller KYC approve hone ke baad hi marketplace activation flow mein use kiya jayega.</p><div id="auth"><input id="email" type="email" placeholder="Admin email"><input id="password" type="password" placeholder="Password"><button class="btn" onclick="login()">Admin Login</button></div><div id="status"></div></div><div id="panel" class="hidden"><div class="card"><h2>📦 Product Approval</h2><p class="small">Sirf approved compliance wale products ko Live kiya ja sakta hai.</p><div id="products">Loading...</div></div><div class="row"><h2 style="flex:1">Seller Applications</h2><button class="btn alt" onclick="loadApplications()">Refresh</button><button class="btn alt" onclick="logout()">Logout</button></div><div id="apps">Loading...</div></div></div><script>const SUPABASE_URL='https://yauveaexbpokhytqijae.supabase.co';const SUPABASE_KEY='sb_publishable_79SNGwvCzpL4OqWBAInVoA_d4xFht6g';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let user=null;const $=id=>document.getElementById(id);function msg(t,err=false){$('status').innerHTML='<div class="card '+(err?'badge no':'badge')+'">'+String(t)+'</div>'}async function login(){const {data,error}=await sb.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(error){msg(error.message,true);return}user=data.user;await boot()}async function boot(){const {data,error}=await sb.rpc('get_seller_applications_admin');if(error){msg('Admin access nahi hai ya session invalid hai.',true);return}$('auth').style.display='none';$('panel').classList.remove('hidden');render(data||[]);loadProducts()}async function loadApplications(){const {data,error}=await sb.rpc('get_seller_applications_admin');if(error){msg(error.message,true);return}render(data||[])}function render(rows){$('apps').innerHTML=rows.length?rows.map(a=>`<div class="card"><div class="row"><h3 style="flex:1">${esc(a.seller_name||'Unnamed Seller')}</h3><span class="badge ${a.kyc_status==='Verified'?'ok':a.kyc_status==='Rejected'?'no':''}">${esc(a.kyc_status||'Pending')}</span></div><div class="grid"><div><b>Seller Type</b><div>${esc(a.seller_type)}</div><b>Mobile</b><div>${esc(a.mobile)}</div><b>Email</b><div>${esc(a.email)}</div><b>Address</b><div>${esc(a.address)}</div></div><div><b>PAN</b><div>${esc(a.pan)}</div><b>GSTIN</b><div>${esc(a.gstin||'Not provided')}</div><b>Category</b><div>${esc(a.category)}</div><b>Licence</b><div>${esc(a.licence_details||'Not provided')}</div></div></div><hr><label>Status<select id="st-${a.id}"><option>Pending</option><option>Under Review</option><option>Verified</option><option>Rejected</option></select></label><textarea id="note-${a.id}" placeholder="Verification notes"></textarea><textarea id="reason-${a.id}" placeholder="Rejection reason (only if rejected)"></textarea><button class="btn" onclick="save('${a.id}')">Save Verification</button></div>`).join(''):'No seller applications yet.';rows.forEach(a=>{const s=$('st-'+a.id);if(s)s.value=a.kyc_status||'Pending'})}async function save(id){const status=$('st-'+id).value;const reason=$('reason-'+id).value;const notes=$('note-'+id).value;const {error}=await sb.rpc('set_seller_verification',{p_application_id:id,p_status:status,p_reason:reason,p_notes:notes});if(error){msg(error.message,true);return}msg('Seller status updated: '+status);loadApplications()}async function loadProducts(){const {data,error}=await sb.from('products').select('*').order('created_at',{ascending:false}).limit(100);if(error){$('products').innerHTML='<div class="badge no">'+esc(error.message)+'</div>';return}$('products').innerHTML=(data||[]).length?(data||[]).map(p=>'<div class="card"><div class="row"><h3 style="flex:1">'+esc(p.name||'Unnamed Product')+'</h3><span class="badge '+(p.compliance_status==='approved'?'ok':'')+'">'+esc(p.compliance_status||'pending')+'</span></div><div class="small">MRP: ₹'+esc(p.mrp||'—')+' · Selling: ₹'+esc(p.selling_price||p.price||'—')+' · Brand: '+esc(p.brand||'—')+'</div><div class="row" style="margin-top:8px"><select id="pc-'+p.id+'"><option value="pending">Pending</option><option value="under_review">Under Review</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select><button class="btn" onclick="saveProduct(\''+p.id+'\')">Save & Update</button></div></div>').join(''):'No products found.';(data||[]).forEach(p=>{const s=$('pc-'+p.id);if(s)s.value=p.compliance_status||'pending'})}
async function saveProduct(id){const status=$('pc-'+id).value;const live=status==='approved';const {error}=await sb.from('products').update({compliance_status:status,is_live:live,approved_at:live?new Date().toISOString():null,approved_by:live?user.id:null}).eq('id',id);if(error){msg(error.message,true);return}msg('Product status updated: '+status);loadProducts()}
async function logout(){await sb.auth.signOut();location.reload()}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}sb.auth.getSession().then(async({data})=>{if(data.session){user=data.session.user;await boot()}})</script></body></html>
