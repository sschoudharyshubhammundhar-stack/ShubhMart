<!doctype html><html lang="hi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ShubhMart Delivery Partner</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="../config/app-config.js"></script><script src="../shared/supabase-client.js"></script><style>body{font-family:Arial;margin:0;background:#f6f7fb;color:#222}.top{background:#111;color:#fff;padding:16px}.wrap{max-width:900px;margin:auto;padding:16px}.panel,.card{background:#fff;border-radius:14px;padding:16px;margin:12px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}input,select{width:100%;box-sizing:border-box;padding:11px;margin:5px 0;border:1px solid #ddd;border-radius:9px}.btn{border:0;border-radius:9px;padding:10px 13px;background:#111;color:#fff;margin:4px}.alt{background:#eee;color:#111}.hidden{display:none}.msg{padding:10px;border-radius:9px;background:#eef6ff}.ok{background:#effff2}.danger{background:#fff0f0}.small{font-size:13px;color:#666}</style><link rel="stylesheet" href="../assets/shubhmart-responsive.css"></head><body><div class="top"><div class="wrap"><div><b>🛍️ ShubhMart <span style="color:#f5c400">DELIVERY</span></b><div>Delivery Partner Center</div></div></div></div><div class="wrap"><button class="btn alt" onclick="location.href='../index.html'">← Store</button><button id="logout" class="btn alt hidden" onclick="deliveryLogout()">Logout</button><div id="msg"></div><section id="auth" class="panel"><h2>Delivery Partner Login / Registration</h2><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><input id="name" placeholder="Name"><input id="phone" placeholder="Mobile"><input id="vehicle" placeholder="Vehicle type"><input id="vehicleNo" placeholder="Vehicle number"><button class="btn" onclick="deliveryLogin()">Login</button><button class="btn alt" onclick="deliveryRegister()">Register</button></section><section id="dash" class="hidden"><div class="panel"><h2 id="title">Delivery Dashboard</h2><button class="btn" onclick="toggleAvailability()">🟢 Toggle Online/Offline</button><div id="partnerStatus"></div></div><div class="panel"><h3>Assigned Shipments</h3><div id="shipments">Loading...</div></div></section></div><script src="delivery-panel.js"></script></body></html>
