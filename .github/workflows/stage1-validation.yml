name: ShubhMart Stage 1 Validation (no deployment)

on:
  push:
    branches:
      - "stage1/build-validation"
      - "stage2/secure-checkout-audit"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax:
    name: JavaScript, SQL and checkout integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Run checkout migration integration tests in disposable PostgreSQL
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          psql -h localhost -p 5432 -U postgres -d postgres -v ON_ERROR_STOP=1 -f supabase/tests/checkout_migration_test.sql

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type-check Supabase Edge Functions
        shell: bash
        run: |
          set -euo pipefail
          deno check supabase/functions/create-customer-order/index.ts supabase/functions/razorpay-payment/index.ts

      - name: Parse checkout SQL migration syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --disable-pip-version-check pglast
          python3 - <<'PY'
          from pathlib import Path
          from pglast import parse_sql

          path = Path("supabase/migrations/20261009_secure_checkout_order_payment_flow.sql")
          statements = parse_sql(path.read_text(encoding="utf-8"))
          if not statements:
              raise SystemExit("No SQL statements found in checkout migration.")
          print(f"Parsed {len(statements)} top-level SQL statements.")
          PY

      - name: Check standalone JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find . -type f \( -name "*.js" -o -name "*.mjs" \) \
            -not -path "./node_modules/*" -not -path "./.git/*" \
            -not -path "./.wrangler/*" -print0)

      - name: Extract and check inline scripts in index.html
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess
          import tempfile

          class ScriptExtractor(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.current = None
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "script":
                      return
                  attrs = dict(attrs)
                  if attrs.get("src"):
                      return
                  typ = (attrs.get("type") or "").lower().strip()
                  if typ and typ not in ("text/javascript", "application/javascript", "module"):
                      return
                  self.current = []
              def handle_data(self, data):
                  if self.current is not None:
                      self.current.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == "script" and self.current is not None:
                      code = "".join(self.current)
                      if code.strip():
                          self.scripts.append(code)
                      self.current = None

          html = Path("index.html").read_text(encoding="utf-8")
          parser = ScriptExtractor()
          parser.feed(html)
          if not parser.scripts:
              raise SystemExit("No inline JavaScript found in index.html; check extractor assumptions.")
          for i, code in enumerate(parser.scripts, 1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", encoding="utf-8", delete=False) as f:
                  f.write(code)
                  name = f.name
              print(f"Checking inline script {i}/{len(parser.scripts)}")
              result = subprocess.run(["node", "--check", name], text=True)
              if result.returncode:
                  raise SystemExit(f"Syntax check failed for inline script {i}")
          print(f"Passed syntax check for {len(parser.scripts)} inline script(s).")
          PY

      - name: Validate Cloudflare assets without deployment
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 deploy --dry-run --outdir /tmp/shubhmart-wrangler-dry-run

      - name: Confirm this workflow cannot deploy
        run: echo "Validation-only workflow. Wrangler is used only with --dry-run; no production deployment occurs."
