name: ShubhMart Secret Scan

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["fix/secure-checkout-edge-function"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan repository history for exposed secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# This workflow is intentionally read-only: it does not deploy, migrate, or modify production.
# A finding must be triaged; if a real secret was exposed, rotate/revoke it rather than only deleting the text.
