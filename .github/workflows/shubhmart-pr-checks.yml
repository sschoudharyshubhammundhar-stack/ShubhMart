name: ShubhMart PR Syntax Checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["fix/secure-checkout-edge-function"]

permissions:
  contents: read

jobs:
  javascript-syntax:
    name: JavaScript syntax validation (no deployment)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check all JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -print0)
          echo "Syntax check passed for $count JavaScript files."
