name: ShubhMart Source Security Checks

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["fix/secure-checkout-edge-function"]

permissions:
  contents: read

jobs:
  source-security-checks:
    name: Syntax, regression tests, and Edge Function type-check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check all JavaScript files
        shell: bash
        run: |
          set -euo pipefail
          count=0
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
            count=$((count + 1))
          done < <(find . -name "*.js" -not -path "./node_modules/*" -not -path "./.git/*" -print0)
          echo "Syntax check passed for $count JavaScript files."

      - name: Run checkout security regression tests
        run: node --test tests/*.test.js

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: "2.4.5"

      - name: Type-check Supabase Edge Functions
        run: |
          deno check supabase/functions/create-customer-order/index.ts
          deno check supabase/functions/razorpay-payment/index.ts
